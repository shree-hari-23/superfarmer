{% extends 'base.html' %}
{% block content %}

<div class="auth-wrapper">
    <div class="card">
        <div class="text-center mb-2">
            <div style="font-size:2.5rem; margin-bottom:0.5rem;">🌱</div>
            <h2 style="margin-bottom:0.25rem;">Create Account</h2>
            <p class="text-muted" style="margin:0;">Join SuperFarmer — your AI farming partner</p>
        </div>

        <hr class="divider">

        {% if error %}
        <div class="alert alert-danger">⚠️ {{ error }}</div>
        {% endif %}

        <form action="{{ url_for('signup') }}" method="POST">
            <div class="form-group full-width">
                <label for="email">Email address</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required>
            </div>
            <div class="form-group full-width">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Choose a strong password" required>
            </div>
            <div class="form-group full-width">
                <button type="submit" class="btn btn-full">Create Account →</button>
            </div>
        </form>

        <p class="text-center text-muted mt-2" style="margin-bottom:0;">
            Already have an account? <a href="{{ url_for('login') }}" style="color: var(--primary); font-weight:600;">Sign in</a>
        </p>
    </div>
</div>

{% endblock %}
